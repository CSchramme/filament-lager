<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Filament-Lager</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="theme-color" content="#0B6B73">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%230B6B73' stroke-width='6'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%230B6B73'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="var(--accent)" stroke-width="6"/><circle cx="16" cy="16" r="4" fill="var(--accent)"/></svg>
        Filament-Lager
      </div>
      <button class="menu-btn" type="button" id="menu-btn" aria-expanded="false" aria-controls="tabs" aria-label="Menü öffnen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span id="menu-label">Menü</span>
      </button>
      <nav class="tabs" id="tabs" aria-label="Bereiche">
        <button class="tab" type="button" data-view="lager">Lager</button>
        <button class="tab" type="button" data-view="plaetze">Plätze</button>
        <button class="tab" type="button" data-view="preise">Preisliste</button>
        <button class="tab" type="button" data-view="rechner">Rechner</button>
        <button class="tab" type="button" data-view="drucke">Drucke</button>
        <button class="tab" type="button" data-view="auswertung">Auswertung</button>
        <button class="tab" type="button" data-view="bambu">Bambu</button>
        <button class="tab" type="button" data-view="einstellungen">Einstellungen</button>
      </nav>
      <span class="mode" id="mode" title="">lädt …</span>
    </div>
  </header>

  <main class="wrap" id="view" aria-live="polite">
    <div class="empty-state">Lager wird geladen …</div>
  </main>

  <div class="toasts" id="toasts" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
