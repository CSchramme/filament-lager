<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Filament-Lager</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="theme-color" content="#0B6B73">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%230B6B73' stroke-width='6'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%230B6B73'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <!-- CSS und Programm lädt das Skript unten mit Versionskennung; bis dahin unsichtbar -->
  <style>html { background: #EEF1F4; } body { visibility: hidden; }</style>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="var(--accent)" stroke-width="6"/><circle cx="16" cy="16" r="4" fill="var(--accent)"/></svg>
        Filament-Lager
      </div>
      <button class="menu-btn" type="button" id="menu-btn" aria-expanded="false" aria-controls="tabs" aria-label="Menü öffnen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span id="menu-label">Menü</span>
      </button>
      <nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
      <span class="mode" id="mode" title="">lädt …</span>
    </div>
  </header>

  <main class="wrap" id="view" aria-live="polite">
    <div class="empty-state">Lager wird geladen …</div>
  </main>

  <div class="toasts" id="toasts" role="status"></div>

  <script>
    // Nach einem Update nie alte Dateien aus dem Browser-Cache mit neuen mischen:
    // Versionskennung vom Server holen, dann CSS und alle Module mit ?v=… laden
    // (Import-Map). Ohne Server (statische Seite) geht es ohne Kennung.
    (function () {
      function show() { document.body.style.visibility = 'visible'; }
      function load(info) {
        var v = info && info.v ? '?v=' + encodeURIComponent(info.v) : '';
        if (v && info.modules && window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap')) {
          var imports = {};
          info.modules.forEach(function (m) { imports[new URL(m, location.href).href] = new URL(m + v, location.href).href; });
          var map = document.createElement('script');
          map.type = 'importmap';
          map.textContent = JSON.stringify({ imports: imports });
          document.head.appendChild(map);
        }
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = 'css/app.css' + v;
        css.onload = show;
        css.onerror = show;
        document.head.appendChild(css);
        setTimeout(show, 3000);
        var app = document.createElement('script');
        app.type = 'module';
        app.src = 'js/app.js' + v;
        document.body.appendChild(app);
      }
      fetch('version.json', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
        .then(load);
    })();
  </script>
</body>
</html>
